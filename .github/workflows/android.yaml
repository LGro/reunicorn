name: Test and Build Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  android:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: System dependencies with apt
        run: apt -qq update && apt -q install build-essential git curl jq unzip xz-utils android-sdk -y

      # Steps run as root inside the container, but the tool cache (/__t) and
      # workspace are owned by the runner user, so git rejects them as "dubious
      # ownership". Must be set before any action that shells out to git.
      - name: Trust container-mounted repositories
        run: git config --global --add safe.directory '*'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Platform must match compileSdkVersion in android/app/build.gradle and
      # the NDK must match ndkVersion there. Build-tools are intentionally not
      # pinned: AGP downloads the revision it requires.
      - name: Install Android SDK components
        run: |
          # Install NDK from stable
          sdkmanager "ndk;28.2.13676358"
          # Install API 37 from canary/preview
          sdkmanager --channel=3 "platforms;android-37"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Checkout Veilid
        run: cd .. && git clone https://gitlab.com/veilid/veilid.git

      - uses: actions/checkout@v4

      - name: Add Rust Targets
        run: |
          source "$HOME/.cargo/env"
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Test
        run: |
          source "$HOME/.cargo/env"
          flutter config --no-analytics
          flutter pub get
          flutter test

      - name: Build APK
        if: github.ref == 'refs/heads/main'
        run: |
          source "$HOME/.cargo/env"
          flutter clean
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk

  upload-apk:
    needs: [android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: System dependencies with apt
        run: apt -qq update && apt -q install curl -y

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Upload APK
        run: curl -T ./android/app-release.apk --ssl-reqd ftp://${{secrets.FTP_SERVER}}/public_html/releases/ -u ${{secrets.FTP_USER}}:${{secrets.FTP_PASSWORD}}
