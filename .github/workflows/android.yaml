name: Test and Build Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Cheap and first: catches the toolchain pins drifting away from
      # android/app/build.gradle, .fvmrc or veilid before spending a build on it.
      - name: Check pinned toolchain versions
        run: ./docker/check-versions.sh

      # versions.env is the single source of truth; export it so the image build
      # below uses the same pins as ./docker/build-apk.sh does locally.
      - name: Load pinned versions
        run: sed -nE 's/^([A-Z_]+)="(.*)"$/\1=\2/p' docker/versions.env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Built inline rather than pulled from a registry. The layer cache carries
      # the toolchain between runs; only the veilid layer (deliberately last in
      # the Dockerfile) is invalidated when VEILID_REF moves.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          load: true
          tags: reunicorn-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
            ANDROID_NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
            ANDROID_PLATFORM_VERSIONS=${{ env.ANDROID_PLATFORM_VERSIONS }}
            ANDROID_BUILD_TOOLS_VERSIONS=${{ env.ANDROID_BUILD_TOOLS_VERSIONS }}
            ANDROID_CMAKE_VERSIONS=${{ env.ANDROID_CMAKE_VERSIONS }}
            ANDROID_CMDLINE_TOOLS_VERSION=${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
            VEILID_REPO=${{ env.VEILID_REPO }}
            VEILID_REF=${{ env.VEILID_REF }}

      # No Gradle/pub volume here on purpose: a runner VM is fresh every time, so
      # a named volume would persist nothing. The Docker layer cache above is
      # what actually carries between runs. Caching the Gradle home across runs
      # would be a further win but needs its own actions/cache wiring.
      # HOST_UID/HOST_GID are passed for the same reason as locally: the
      # container runs as root, and without them everything it writes into the
      # checkout stays root-owned for later steps.
      - name: Test
        run: |
          docker run --rm \
            -v "$PWD:/workspaces/reunicorn" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            reunicorn-build:ci test

      # Built on every event, not just main: a pull request that breaks the
      # Android build should fail the pull request.
      - name: Build APK
        env:
          REUNICORN_MAPTILER_TOKEN: ${{ secrets.REUNICORN_MAPTILER_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD:/workspaces/reunicorn" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e REUNICORN_MAPTILER_TOKEN \
            reunicorn-build:ci build-apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk

  upload-apk:
    needs: [android]
    # github.ref is refs/tags/... on a release, so a plain refs/heads/main test
    # would skip releases entirely — which is what used to happen.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Upload APK
        run: curl -T ./android/app-release.apk --ssl-reqd ftp://${{secrets.FTP_SERVER}}/public_html/releases/ -u ${{secrets.FTP_USER}}:${{secrets.FTP_PASSWORD}}
